services:
  - type: web
    name: zim-job-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node src/index.js
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: WHATSAPP_OWNER_NUMBER
        sync: false
      - key: PROFILE_MD_BASE64
        sync: false
      - key: CV_TEMPLATE_MD_BASE64
        sync: false
      - key: SCRAPE_INTERVAL_MINUTES
        value: "30"
      - key: MATCH_THRESHOLD
        value: "7"
      - key: MAX_PAGES_PER_SOURCE
        value: "2"
      - key: SCRAPER_USER_AGENT
        value: "Mozilla/5.0 (compatible; PersonalJobBot/1.0)"
